[project]
name = "palm-mind-rag"
version = "0.1.0"
description = "Document ingestion and conversational RAG API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "email-validator>=2.0",
    "fastapi>=0.115",
    "fastembed>=0.8.1",
    "openai>=3.19.2",
    "pydantic-settings>=2.4",
    "pypdf>=4.0",
    "python-multipart>=0.0.9",
    "qdrant-client>=1.10",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "fakeredis>=2.38.0",
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
[[tool.mypy.overrides]]
module = ["fastembed.*"]
ignore_missing_imports = true
